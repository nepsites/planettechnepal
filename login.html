<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Planet Tech Nepal</title>
  <meta name="description" content="Sign in to your Planet Tech Nepal account to manage cameras, weather stations and live streams." />
  <link rel="canonical" href="https://planettechnepal.com/login" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Planet Tech Nepal — home">
        <img src="assets/images/logo.webp" alt="Planet Tech Nepal" width="155" height="56" />
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="live-cameras">Live Cameras</a>
        <a href="weather">Weather</a>
        <a href="technology">Technology</a>
        <a href="pricing">Pricing</a>
        <a href="about">About Us</a>
        <a href="contact">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="login" class="btn btn-login">Login</a>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="login-split">

      <div class="login-panel">
        <div class="login-card">
          <form id="loginForm" class="login-form" novalidate>
            <div class="login-field">
              <label for="email" class="sr-only">Email</label>
              <div class="login-input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
                <input type="text" id="email" name="email" autocomplete="username" placeholder="Email" required />
              </div>
            </div>
            <div class="login-field">
              <label for="password" class="sr-only">Password</label>
              <div class="login-input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required />
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="login-row">
              <label class="login-remember"><input type="checkbox" checked /> Keep me logged in</label>
              <a href="contact">Forgot password?</a>
            </div>

            <p class="login-error" id="loginError" role="alert" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Username or password is incorrect.
            </p>

            <button type="submit" class="btn btn-dark btn-block">Login</button>
          </form>

          <p class="login-foot">Need an account? <a href="contact">Contact us</a></p>
        </div>
      </div>

      <div class="login-visual login-visual-shapes">
        <div class="shape shape-a"></div>
        <div class="shape shape-b"></div>
        <div class="shape shape-c"></div>
        <div class="shape shape-d"></div>
        <div class="dot-grid"></div>
        <div class="login-visual-copy">
          <h2 class="login-visual-title">Connecting mountains<br />to the world.</h2>
          <p class="login-visual-sub">One account for every camera, weather station and live stream across your network.</p>
        </div>
      </div>

    </section>
  </main>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
